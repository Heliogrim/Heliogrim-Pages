site_name: Heliogrim
site_url: https://heliogrim.github.io/Heliogrim-Pages/
site_description: Architecture, decisions and guides for the Heliogrim engine
# repo_url is left unset on purpose: the header widget calls api.github.com from the visitor browser.
edit_uri: https://github.com/Heliogrim/Heliogrim-Pages/edit/main/docs/
copyright: Heliogrim &middot; <a href="/Heliogrim-Pages/legal/privacy/">Privacy</a> &middot; <a href="/Heliogrim-Pages/legal/imprint/">Imprint</a> &middot; <a href="/Heliogrim-Pages/legal/licenses/">Licenses</a>

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
    - content.code.annotate

extra_javascript:
  - javascripts/diagrams.js

extra_css:
  - stylesheets/heliogrim.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Heliogrim
      name: Heliogrim on GitHub
  generator: false

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        # Own class (not "mermaid"): the theme would load Mermaid from a CDN for that one.
        - name: hg-diagram
          class: hg-diagram
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

