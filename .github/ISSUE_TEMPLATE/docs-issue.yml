name: Docs error
description: A wrong statement, dead link, stale status or unclear page.
title: "[Docs] "
labels: [documentation]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: URL or file path.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested correction
